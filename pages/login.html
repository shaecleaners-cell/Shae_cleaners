<!DOCTYPE html>
<html lang="id">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="theme-color"
    content="#16a34a"
  >

  <title>Login - Shae Cleaners</title>


  <!-- FONT AWESOME -->

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
  >


  <!-- LOGIN CSS -->

  <link
    rel="stylesheet"
    href="/css/login.css"
  >

</head>


<body>


  <!-- =====================================================
       LOGIN PAGE
  ====================================================== -->

  <main class="auth-page">


    <!-- ===================================================
         BRAND
    ==================================================== -->

    <section class="auth-brand">

      <div class="brand-logo">

        <img
          src="assets/logo.png"
          alt="Shae Cleaners"
        >

      </div>


      <h1>
        Shae Cleaners
      </h1>


      <p>
        Cleaning profesional,
        mudah dan terpercaya.
      </p>

    </section>



    <!-- ===================================================
         LOGIN CARD
    ==================================================== -->

    <section class="auth-card">


      <div class="auth-heading">

        <h2>
          Selamat Datang 👋
        </h2>

        <p>
          Login untuk melanjutkan
          pemesanan Anda.
        </p>

      </div>



      <!-- =================================================
           MESSAGE
      ================================================== -->

      <div
        id="loginMessage"
        class="login-message"
        style="display:none"
      ></div>



      <!-- =================================================
           FORM
      ================================================== -->

      <form
        id="loginForm"
        autocomplete="on"
      >


        <!-- ===============================================
             EMAIL / PHONE
        ================================================ -->

        <div class="input-group">

          <label
            for="loginIdentity"
          >
            Email / No. WhatsApp
          </label>


          <div class="input-box">

            <i
              class="fa-solid fa-user"
            ></i>


            <input
              type="text"
              id="loginIdentity"
              name="identity"
              placeholder="Email atau 08xxxxxxxxxx"
              autocomplete="username"
              required
            >

          </div>

        </div>



        <!-- ===============================================
             PASSWORD
        ================================================ -->

        <div class="input-group">

          <label
            for="loginPassword"
          >
            Password
          </label>


          <div class="input-box">

            <i
              class="fa-solid fa-lock"
            ></i>


            <input
              type="password"
              id="loginPassword"
              name="password"
              placeholder="Masukkan password"
              autocomplete="current-password"
              required
            >


            <button
              type="button"
              id="togglePassword"
              class="password-toggle"
              aria-label="Tampilkan password"
            >

              <i
                class="fa-solid fa-eye"
              ></i>

            </button>

          </div>

        </div>



        <!-- ===============================================
             FORGOT PASSWORD
        ================================================ -->

        <div class="auth-options">

          <a
            href="javascript:void(0)"
            onclick="forgotPassword()"
          >
            Lupa password?
          </a>

        </div>



        <!-- ===============================================
             LOGIN BUTTON
        ================================================ -->

        <button
          type="submit"
          class="auth-button"
        >

          <i
            class="fa-solid fa-right-to-bracket"
          ></i>

          Login

        </button>


      </form>



      <!-- =================================================
           REGISTER
      ================================================== -->

      <div class="auth-divider">

        <span>
          atau
        </span>

      </div>


      <button
        type="button"
        id="registerButton"
        class="register-button"
      >

        <i
          class="fa-solid fa-user-plus"
        ></i>

        Buat Akun Baru

      </button>



      <!-- =================================================
           SECURITY
      ================================================== -->

      <div class="security-note">

        <i
          class="fa-solid fa-shield-halved"
        ></i>

        <span>
          Data Anda digunakan untuk
          kebutuhan pemesanan Shae Cleaners.
        </span>

      </div>


    </section>


    <!-- ===================================================
         FOOTER
    ==================================================== -->

    <footer class="auth-footer">

      © 2026 Shae Cleaners

    </footer>


  </main>



  <!-- =====================================================
       SCRIPT
  ====================================================== -->

  <script src="js/login.js"></script>


  <script>

    function forgotPassword() {

      const phone =
        prompt(
          "Masukkan nomor WhatsApp yang terdaftar:"
        );


      if (!phone) {

        return;

      }


      const message =
        `Halo Shae Cleaners, saya lupa password akun saya.

Nomor WhatsApp:
${phone}

Mohon bantuan untuk pemulihan akun saya.
Terima kasih.`;


      const wa =
        "https://wa.me/6283813138221?text=" +
        encodeURIComponent(
          message
        );


      window.location.href =
        wa;

    }

  </script>


</body>

</html>
