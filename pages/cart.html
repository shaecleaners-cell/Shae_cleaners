<!DOCTYPE html>
<html lang="id">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Keranjang - Shae Cleaners</title>

  <meta
    name="description"
    content="Keranjang pesanan Shae Cleaners"
  >

  <link
    rel="stylesheet"
    href="/css/style.css"
  >

  <link
    rel="stylesheet"
    href="/css/cart.css"
  >

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
  >

</head>


<body>


<!-- =====================================================
     HEADER
===================================================== -->

<header class="cart-header">


  <button
    type="button"
    class="cart-header-button"
    onclick="history.back()"
    aria-label="Kembali"
  >

    <i class="fa-solid fa-arrow-left"></i>

  </button>


  <div class="cart-header-title">

    <h1>
      Keranjang
    </h1>

    <span>
      Shae Cleaners
    </span>

  </div>


  <button
    type="button"
    class="cart-header-button"
    onclick="location.href='index.html'"
    aria-label="Home"
  >

    <i class="fa-solid fa-house"></i>

  </button>


</header>



<!-- =====================================================
     MAIN
===================================================== -->

<main class="cart-main">


  <!-- ===================================================
       EMPTY CART
  ==================================================== -->

  <section
    id="cartEmpty"
    class="cart-empty"
    style="display:none;"
  >

    <div class="cart-empty-icon">

      <i class="fa-solid fa-cart-shopping"></i>

    </div>


    <h2>
      Keranjang Masih Kosong
    </h2>


    <p>
      Pilih layanan cleaning yang ingin
      Anda pesan.
    </p>


    <button
      type="button"
      class="cart-shop-button"
      onclick="location.href='index.html'"
    >

      <i class="fa-solid fa-store"></i>

      Pilih Layanan

    </button>

  </section>



  <!-- ===================================================
       CART CONTENT
  ==================================================== -->

  <section
    id="cartContent"
    style="display:none;"
  >


    <!-- ===============================================
         SELECT ALL
    ================================================ -->

    <div class="cart-select-bar">


      <label class="cart-checkbox">

        <input
          type="checkbox"
          id="selectAllCart"
        >


        <span class="custom-checkbox"></span>


        <span>
          Pilih Semua
        </span>

      </label>


      <button
        type="button"
        id="deleteSelected"
        class="cart-delete-selected"
      >

        <i class="fa-regular fa-trash-can"></i>

        Hapus

      </button>

    </div>



    <!-- ===============================================
         CART ITEMS
    ================================================ -->

    <div
      id="cartItems"
      class="cart-items"
    >

      <!-- Diisi oleh cart.js -->

    </div>



    <!-- ===============================================
         PROMO
    ================================================ -->

    <section class="cart-promo">


      <div class="cart-promo-title">

        <i class="fa-solid fa-ticket"></i>

        <span>
          Promo
        </span>

      </div>


      <div class="cart-promo-box">

        <input
          type="text"
          id="promoCode"
          placeholder="Masukkan kode promo"
          maxlength="30"
        >


        <button
          type="button"
          id="applyPromo"
        >
          Pakai
        </button>

      </div>


      <div
        id="promoMessage"
        class="promo-message"
      ></div>


    </section>



    <!-- ===============================================
         SUMMARY
    ================================================ -->

    <section class="cart-summary">


      <div class="cart-summary-row">

        <span>
          Subtotal
        </span>


        <strong id="cartSubtotal">
          Rp0
        </strong>

      </div>


      <div
        class="cart-summary-row"
        id="cartDiscountRow"
        style="display:none;"
      >

        <span>
          Diskon
        </span>


        <strong
          id="cartDiscount"
          class="cart-discount"
        >
          -Rp0
        </strong>

      </div>


      <div class="cart-summary-divider"></div>


      <div class="cart-total-row">

        <span>
          Total
        </span>


        <strong id="cartTotal">
          Rp0
        </strong>

      </div>


    </section>



    <!-- ===============================================
         CHECKOUT
    ================================================ -->

    <section class="cart-checkout-area">


      <div class="cart-checkout-info">

        <span>
          Total pembayaran
        </span>


        <strong id="bottomTotal">
          Rp0
        </strong>

      </div>


      <button
        type="button"
        id="checkoutButton"
        class="checkout-button"
      >

        Lanjut Checkout

        <i class="fa-solid fa-arrow-right"></i>

      </button>

    </section>


  </section>


</main>



<!-- =====================================================
     TOAST
===================================================== -->

<div
  id="cartToast"
  class="cart-toast"
>

  <i class="fa-solid fa-circle-check"></i>

  <span id="cartToastText">
    Berhasil
  </span>

</div>



<!-- =====================================================
     JAVASCRIPT
===================================================== -->

<script src="/js/app.js"></script>

<script src="/js/cart.js"></script>


</body>

</html>
