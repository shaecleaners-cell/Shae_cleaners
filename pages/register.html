<!DOCTYPE html>
<html lang="id">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Daftar - Shae Cleaners</title>

  <meta
    name="theme-color"
    content="#16a34a"
  >

  <link
    rel="stylesheet"
    href="css/style.css"
  >

  <link
    rel="stylesheet"
    href="css/auth.css"
  >

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
  >

</head>


<body class="auth-body">


<main class="auth-page">


  <!-- LOGO -->

  <div class="auth-logo">

    <div class="auth-logo-icon">

      <i class="fa-solid fa-spray-can-sparkles"></i>

    </div>

    <strong>
      Shae <span>Cleaners</span>
    </strong>

    <small>
      Cleaning Service Profesional
    </small>

  </div>



  <!-- REGISTER CARD -->

  <section class="auth-card">

    <div class="auth-heading">

      <h1>
        Buat Akun
      </h1>

      <p>
        Daftar untuk memesan layanan Shae Cleaners
      </p>

    </div>


    <form
      id="registerForm"
      novalidate
    >


      <!-- NAMA -->

      <div class="auth-field">

        <label for="registerName">
          Nama Lengkap
        </label>

        <div class="auth-input">

          <i class="fa-regular fa-user"></i>

          <input
            type="text"
            id="registerName"
            placeholder="Nama lengkap"
            autocomplete="name"
            maxlength="60"
            required
          >

        </div>

      </div>



      <!-- WHATSAPP -->

      <div class="auth-field">

        <label for="registerPhone">
          Nomor WhatsApp
        </label>

        <div class="auth-input">

          <i class="fa-brands fa-whatsapp"></i>

          <input
            type="tel"
            id="registerPhone"
            placeholder="08xxxxxxxxxx"
            inputmode="tel"
            autocomplete="tel"
            maxlength="16"
            required
          >

        </div>

      </div>



      <!-- PASSWORD -->

      <div class="auth-field">

        <label for="registerPassword">
          Password
        </label>

        <div class="auth-input">

          <i class="fa-solid fa-lock"></i>

          <input
            type="password"
            id="registerPassword"
            placeholder="Minimal 6 karakter"
            autocomplete="new-password"
            minlength="6"
            required
          >

          <button
            type="button"
            class="password-toggle"
            data-target="registerPassword"
          >

            <i class="fa-regular fa-eye"></i>

          </button>

        </div>

      </div>



      <!-- CONFIRM PASSWORD -->

      <div class="auth-field">

        <label for="registerConfirmPassword">
          Ulangi Password
        </label>

        <div class="auth-input">

          <i class="fa-solid fa-shield-halved"></i>

          <input
            type="password"
            id="registerConfirmPassword"
            placeholder="Ulangi password"
            autocomplete="new-password"
            required
          >

          <button
            type="button"
            class="password-toggle"
            data-target="registerConfirmPassword"
          >

            <i class="fa-regular fa-eye"></i>

          </button>

        </div>

      </div>



      <!-- TERMS -->

      <label class="auth-check">

        <input
          type="checkbox"
          id="registerTerms"
          required
        >

        <span>
          Saya setuju menggunakan layanan
          Shae Cleaners.
        </span>

      </label>



      <button
        type="submit"
        class="auth-submit"
      >

        <i class="fa-solid fa-user-plus"></i>

        Daftar Sekarang

      </button>


    </form>


    <div
      id="authMessage"
      class="auth-message"
    ></div>


    <!-- LOGIN -->

    <div class="auth-footer">

      <span>
        Sudah punya akun?
      </span>

      <a href="login.html">
        Login
      </a>

    </div>


  </section>



  <button
    class="auth-back"
    onclick="location.href='index.html'"
  >

    <i class="fa-solid fa-arrow-left"></i>

    Kembali ke Home

  </button>


</main>


<script src="js/Auth.js"></script>

</body>

</html>
